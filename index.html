<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Fantasy Zodiac Lookup</title>
    <!-- Link your stylesheet -->
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <main class="zodiac-app">
        <h1>Final Fantasy Zodiac Lookup</h1>
        
        <!-- birthday input -->
        <section class="input-section"> 
            <label for="birthDate">Enter your birthday to find your Final Fantasy VII character:</label>
            <input type="date" id="birthDate"> 
            <button type="button" id="lookupBtn">Reveal Character</button>
        </section> 
            
            <!-- output area  -->
            <div id="outputArea" class="output-area" aria-live="polite">
                <!-- lookup result goes here -->
            </div>  

            </section>
            
            <!--sign container--> 
            <section id="signContainer" class="sign-grid">    
        </section>
    </main> 

    <!-- Link your JavaScript file -->
    <script src="main.js"></script>
</body> 
</html>
